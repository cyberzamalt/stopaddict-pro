plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.stopaddict'
    compileSdk 34

    defaultConfig {
        applicationId "com.stopaddict"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // ✅ AJOUT : signature "release" via variables d'environnement (GitHub Actions)
    signingConfigs {
        release {
            def ksPath = System.getenv("UPLOAD_KEYSTORE_PATH")
            def ksPass = System.getenv("UPLOAD_KEYSTORE_PASSWORD")
            def keyAliasEnv = System.getenv("UPLOAD_KEY_ALIAS")
            def keyPass = System.getenv("UPLOAD_KEY_PASSWORD")

            // On ne configure la signature que si tout est présent (évite de casser le build local)
            if (ksPath != null && ksPass != null && keyAliasEnv != null && keyPass != null) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias keyAliasEnv
                keyPassword keyPass
            } else {
                // Pas d’erreur ici : en local tu peux build debug sans secrets
                // et en CI, si ça manque, le bundleRelease ne sera pas signé (et Play refusera).
                println("WARNING: Release signing env vars missing. Release bundle may be unsigned.")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // ✅ AJOUT : applique la signature release
            signingConfig signingConfigs.release
        }
        debug {
            // rien
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // MPAndroidChart pour graphiques
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Google AdMob
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // Gson pour export/import JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
